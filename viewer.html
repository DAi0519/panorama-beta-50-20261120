<!doctype html>
<!--
[INPUT]: 依赖同目录冻结计划、静态完成状态、原图及结果资源
[OUTPUT]: 提供联动360查看器与真实结果链接
[POS]: 本批50项报告的静态网页，不依赖本机服务
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原图与本轮结果 · 360对照</title><link rel="stylesheet" href="vendor/pannellum.css"><style>body{margin:0;background:#f5f2eb;color:#302b25;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{padding:24px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0;color:#716755}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}.viewer{height:68vh;min-height:330px;background:#ded7cb}.tools{display:flex;gap:12px;margin:12px 0}button{font:inherit;padding:6px 12px;background:#fffaf1;border:1px solid #cabeac;color:inherit;border-radius:4px}a{color:#81502f}@media(max-width:680px){.views{grid-template-columns:1fr}.viewer{height:44vh}}</style></head><body><main><h1 id="title">原图与本轮结果 · 360对照</h1><p id="state">正在加载原尺寸PNG</p><div class="tools"><button id="front">正面</button><button id="ceiling">天顶</button><button id="floor">地面</button><a href="report.html">全部50张</a></div><div class="views"><section><strong>原图</strong><div id="source" class="viewer"></div></section><section><strong>本轮结果</strong><div id="result" class="viewer"></div></section></div><p id="links"></p></main><script src="vendor/pannellum.js"></script><script>
(async()=>{try{const index=Number(new URLSearchParams(location.search).get('index'));if(!Number.isInteger(index)||index<0||index>=50)throw Error('无效序号');const [plan,batch,local]=await Promise.all(['plan.json','batch.json','materialization.json'].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('原件还在核验');return r.json()})));const item=batch.items[index],source=plan.originalChecks.samples.find(s=>s.sampleId===item.sampleId),entry=local.entries.find(e=>e.index===index);if(!entry)throw Error('本项原尺寸PNG还在核验，稍后刷新');document.querySelector('#title').textContent=item.label;const views=[['source',source.file],['result',entry.file]].map(([id,url])=>{const v=pannellum.viewer(id,{type:'equirectangular',panorama:url,autoLoad:true,hfov:100});v.on('load',()=>{document.getElementById(id).dataset.loadedPanorama=url});return v});let active=0;for(let i=0;i<2;i++)document.getElementById(i?'result':'source').addEventListener('pointerdown',()=>active=i);let previous='';function sync(){const v=views[active],other=views[1-active],angles=[v.getPitch(),v.getYaw(),v.getHfov()],key=angles.map(x=>x.toFixed(2)).join(',');if(key!==previous){previous=key;other.lookAt(...angles,false)}requestAnimationFrame(sync)}sync();for(const [id,pitch]of [['front',0],['ceiling',90],['floor',-90]])document.getElementById(id).onclick=()=>{views.forEach(v=>v.lookAt(pitch,0,100,false));previous=''};document.querySelector('#state').textContent='两侧视角联动 · 原尺寸 '+entry.width+'×'+entry.height+' · 实际原件SHA已核对';const links=document.querySelector('#links');for(const [text,url]of [['原图原件',source.file],['结果PNG',entry.file],['实际送模词','actual-prompts/'+String(index+1).padStart(3,'0')+'.txt']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target='_blank';a.style.marginRight='18px';links.append(a)}}catch(e){document.querySelector('#state').textContent=e.message}})();
</script></body></html>
